steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: build-api
    args:
      - build
      - --file=api/Dockerfile
      - -t=${_IMAGE_BASE}:${SHORT_SHA}
      - -t=${_IMAGE_BASE}:latest
      - .

images:
  - '${_IMAGE_BASE}:${SHORT_SHA}'
  - '${_IMAGE_BASE}:latest'

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  dynamic_substitutions: true

substitutions:
  _IMAGE_BASE: southamerica-east1-docker.pkg.dev/revhackers-staging/revhackers-staging/revhackers-api
