<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CC6A" />
      <stop offset="100%" stop-color="#008844" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="1" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- Glowing background blur -->
  <circle cx="600" cy="337" r="250" fill="#00CC6A" opacity="0.08" filter="blur(60px)" />

  <!-- Badge Top -->
  <rect x="475" y="100" width="250" height="36" rx="18" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <circle cx="495" cy="118" r="4" fill="#00CC6A" />
  <text x="510" y="123" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="12" fill="#00CC6A" letter-spacing="2">REVHACKERS METRICS</text>

  <!-- Title -->
  <text x="600" y="200" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">REVOPS FRAMEWORK</text>
  <text x="600" y="240" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="20" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">Aligning Marketing, Sales &amp; Customer Success for Growth</text>

  <!-- Interconnected Nodes / Gears -->
  <g transform="translate(0, 40)">
    <!-- Connecting Line -->
    <path d="M 320 400 L 600 400 L 880 400" stroke="#00CC6A" stroke-width="3" stroke-dasharray="6 6" opacity="0.6" />

    <!-- Node 1: Marketing -->
    <g transform="translate(320, 400)">
      <circle r="75" fill="#18181b" stroke="#27272a" stroke-width="3" />
      <circle r="60" fill="none" stroke="#00CC6A" stroke-width="2" stroke-dasharray="8 4" opacity="0.5" />
      <circle r="8" fill="#00CC6A" />
      <text y="-10" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">MARKETING</text>
      <text y="15" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" fill="#00CC6A" text-anchor="middle" letter-spacing="1">AQUISIÇÃO</text>
    </g>

    <!-- Node 2: Sales -->
    <g transform="translate(600, 400)">
      <circle r="90" fill="#18181b" stroke="#00CC6A" stroke-width="4" />
      <circle r="75" fill="none" stroke="#00CC6A" stroke-width="2" opacity="0.3" />
      <circle r="12" fill="#00CC6A" />
      <text y="-10" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">SALES</text>
      <text y="18" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="12" fill="#00CC6A" text-anchor="middle" letter-spacing="1">CONVERSÃO</text>
    </g>

    <!-- Node 3: Customer Success -->
    <g transform="translate(880, 400)">
      <circle r="75" fill="#18181b" stroke="#27272a" stroke-width="3" />
      <circle r="60" fill="none" stroke="#00CC6A" stroke-width="2" stroke-dasharray="8 4" opacity="0.5" />
      <circle r="8" fill="#00CC6A" />
      <text y="-10" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">CS &amp; EXPANSÃO</text>
      <text y="15" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="11" fill="#00CC6A" text-anchor="middle" letter-spacing="1">RETENÇÃO</text>
    </g>
  </g>

  <!-- Bottom Brand Signature -->
  <text x="600" y="620" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="16" fill="#71717a" text-anchor="middle" letter-spacing="3">REVHACKERS GTM ENGINEERING</text>
</svg>
