<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272a" stroke-width="1" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  <rect width="1200" height="675" fill="url(#grid)" />
  <circle cx="600" cy="337" r="280" fill="#00CC6A" opacity="0.07" filter="blur(70px)" />

  <!-- Badge Top -->
  <rect x="450" y="90" width="300" height="36" rx="18" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <circle cx="470" cy="108" r="4" fill="#00CC6A" />
  <text x="485" y="113" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#00CC6A" letter-spacing="2">REVHACKERS SALES ENGINE</text>

  <!-- Title -->
  <text x="600" y="190" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="-1">PROCESSO COMERCIAL B2B</text>
  <text x="600" y="230" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="18" fill="#a1a1aa" text-anchor="middle" letter-spacing="1">Playbook de Vendas, SPICED, MEDDIC &amp; Pipeline Velocity</text>

  <!-- Pipeline Flow 5 Stages -->
  <g transform="translate(60, 310)">
    <!-- Stage 1: Lead -->
    <g transform="translate(0, 0)">
      <rect width="190" height="180" rx="16" fill="#18181b" stroke="#27272a" stroke-width="2" />
      <circle cx="35" cy="40" r="16" fill="#00CC6A" opacity="0.15" />
      <text x="35" y="45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" fill="#00CC6A" text-anchor="middle">01</text>
      <text x="35" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff">AQUISIÇÃO</text>
      <text x="35" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#a1a1aa">Leads &amp; MQLs</text>
      <rect x="35" y="135" width="120" height="4" rx="2" fill="#00CC6A" />
    </g>

    <!-- Arrow 1 -->
    <path d="M 205 90 L 225 90" stroke="#00CC6A" stroke-width="3" stroke-dasharray="4 4" />

    <!-- Stage 2: Qualificação -->
    <g transform="translate(240, 0)">
      <rect width="190" height="180" rx="16" fill="#18181b" stroke="#27272a" stroke-width="2" />
      <circle cx="35" cy="40" r="16" fill="#00CC6A" opacity="0.15" />
      <text x="35" y="45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" fill="#00CC6A" text-anchor="middle">02</text>
      <text x="35" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff">SDR / IA</text>
      <text x="35" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#a1a1aa">Qualificação &amp; SLA</text>
      <rect x="35" y="135" width="120" height="4" rx="2" fill="#00CC6A" />
    </g>

    <!-- Arrow 2 -->
    <path d="M 445 90 L 465 90" stroke="#00CC6A" stroke-width="3" stroke-dasharray="4 4" />

    <!-- Stage 3: Discovery -->
    <g transform="translate(480, 0)">
      <rect width="190" height="180" rx="16" fill="#18181b" stroke="#00CC6A" stroke-width="2" />
      <circle cx="35" cy="40" r="16" fill="#00CC6A" />
      <text x="35" y="45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" fill="#09090b" text-anchor="middle">03</text>
      <text x="35" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff">DISCOVERY</text>
      <text x="35" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#00CC6A">Diagnóstico SPICED</text>
      <rect x="35" y="135" width="120" height="4" rx="2" fill="#00CC6A" />
    </g>

    <!-- Arrow 3 -->
    <path d="M 685 90 L 705 90" stroke="#00CC6A" stroke-width="3" stroke-dasharray="4 4" />

    <!-- Stage 4: Proposta -->
    <g transform="translate(720, 0)">
      <rect width="190" height="180" rx="16" fill="#18181b" stroke="#27272a" stroke-width="2" />
      <circle cx="35" cy="40" r="16" fill="#00CC6A" opacity="0.15" />
      <text x="35" y="45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" fill="#00CC6A" text-anchor="middle">04</text>
      <text x="35" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff">PROPOSTA</text>
      <text x="35" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" fill="#a1a1aa">Demonstração &amp; ROI</text>
      <rect x="35" y="135" width="120" height="4" rx="2" fill="#00CC6A" />
    </g>

    <!-- Arrow 4 -->
    <path d="M 925 90 L 945 90" stroke="#00CC6A" stroke-width="3" stroke-dasharray="4 4" />

    <!-- Stage 5: Fechamento -->
    <g transform="translate(960, 0)">
      <rect width="120" height="180" rx="16" fill="#00CC6A" opacity="0.1" stroke="#00CC6A" stroke-width="2" />
      <circle cx="35" cy="40" r="16" fill="#00CC6A" />
      <text x="35" y="45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="14" fill="#09090b" text-anchor="middle">05</text>
      <text x="35" y="90" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" fill="#ffffff">WON</text>
      <text x="35" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#00CC6A">Receita ARR</text>
    </g>
  </g>

  <!-- Bottom Brand -->
  <text x="600" y="615" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="15" fill="#71717a" text-anchor="middle" letter-spacing="3">REVHACKERS ARCHITECTURE</text>
</svg>
