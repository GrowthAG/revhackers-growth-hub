<svg width="1500" height="600" viewBox="0 0 1500 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030706"/>
      <stop offset="50%" stop-color="#090d0b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Subtle Matrix Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00CC6A" stroke-width="1" stroke-opacity="0.07"/>
    </pattern>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1500" height="600" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <rect width="1500" height="600" fill="url(#grid)"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="1500" height="4" fill="#00CC6A"/>

  <!-- Safe Zone Ambient Glow in Center -->
  <circle cx="750" cy="300" r="250" fill="#00CC6A" opacity="0.06" filter="url(#glow)"/>

  <!-- Centered Logo Text / Branding in Safe Zone -->
  <g transform="translate(750, 280)">
    <!-- REVHACKERS Wordmark in Crisp White -->
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="12" fill="#FFFFFF">
      REVHACKERS
    </text>
    
    <!-- Subtitle Badge -->
    <rect x="-160" y="32" width="320" height="32" rx="16" fill="#00CC6A" fill-opacity="0.12" stroke="#00CC6A" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="53" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" letter-spacing="3" fill="#00CC6A">
      SINGLE SOURCE OF TRUTH
    </text>
  </g>

  <!-- Bottom Accent Neon Bar -->
  <rect x="0" y="596" width="1500" height="4" fill="#00CC6A"/>
</svg>