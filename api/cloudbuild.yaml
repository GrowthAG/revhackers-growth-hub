steps:
  # Build da imagem Docker
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=api/Dockerfile
      - --tag=${_IMAGE}
      - .
  # Deploy no Cloud Run
  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - revhackers-api-staging
      - --image=${_IMAGE}
      - --region=southamerica-east1
      - --platform=managed
      - --allow-unauthenticated
      - --project=revhackers-staging
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE: southamerica-east1-docker.pkg.dev/revhackers-staging/revhackers-staging/revhackers-api:manual
