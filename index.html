  <!-- Auto-reload handler for deploy chunk updates (prevents white screens) -->
  <script>
    // Aggressive Continuous Purge to instantly obliterate any GHL / LeadConnector widget injected via GTM
    (function() {
      function killGhlWidget() {
        try {
          var selectors = [
            'chat-widget',
            '#chat-widget',
            '#leadconnector-chat-widget',
            '.hl-chat-widget',
            '#hl-chat-widget-container',
            '[id*="chat-widget"]',
            '[class*="chat-widget"]',
            '[id*="leadconnector"]',
            '[class*="leadconnector"]',
            'iframe[src*="leadconnector"]',
            'iframe[src*="widget.leadconnectorhq"]',
            'iframe[src*="msgsndr"]'
          ];
          for (var i = 0; i < selectors.length; i++) {
            var targets = document.querySelectorAll(selectors[i]);
            for (var j = 0; j < targets.length; j++) {
              targets[j].remove();
            }
          }
        } catch(e) {}
      }
      if (typeof window !== 'undefined') {
        window.addEventListener('DOMContentLoaded', killGhlWidget);
        setInterval(killGhlWidget, 200);
        var obs = new MutationObserver(killGhlWidget);
        obs.observe(document.documentElement, { childList: true, subtree: true });
      }
    })();

    window.addEventListener('error', function(e) {
      var msg = (e && e.message ? String(e.message) : '') + (e && e.filename ? String(e.filename) : '');
      var isChunkError = (
        msg.indexOf('Loading chunk') !== -1 ||
        msg.indexOf('dynamically imported module') !== -1 ||
        msg.indexOf('Importing a module script failed') !== -1 ||
        msg.indexOf('error loading dynamically imported module') !== -1
      );
      if (isChunkError) {
        var lastReload = parseInt(sessionStorage.getItem('rev_chunk_last_reload') || '0', 10);
        if (Date.now() - lastReload > 3000) {
          sessionStorage.setItem('rev_chunk_last_reload', String(Date.now()));
          window.location.reload(true);
        }
      }
    }, true);
  </script>

<body>
  <!-- Chunk stale cache guard: reloads ONCE if a dynamic import fails or root fails to mount -->
  <script>
    window.addEventListener("error", function(e) {
      var msg = (e.message || '') + (e.filename || '');
      var isChunkError = (
        msg.includes("Failed to fetch dynamically imported module") ||
        msg.includes("Importing a module script failed") ||
        msg.includes("error loading dynamically imported module")
      );
      if (isChunkError && !sessionStorage.getItem('__rx_chunk_refresh')) {
        sessionStorage.setItem('__rx_chunk_refresh', '1');
        window.location.reload(true);
      }
    });

    // Auto-detect empty #root (White Screen) and self-heal automatically
    setTimeout(function() {
      var root = document.getElementById('root');
      if (root && !root.hasChildNodes()) {
        var lastWs = parseInt(sessionStorage.getItem('__rx_ws_last') || '0', 10);
        if (Date.now() - lastWs > 4000) {
          sessionStorage.setItem('__rx_ws_last', String(Date.now()));
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          window.location.reload(true);
        }
      }
    }, 1500);

    window.addEventListener('load', function() {
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.hasChildNodes()) {
          sessionStorage.removeItem('__rx_chunk_refresh');
          sessionStorage.removeItem('__rx_ws_recovered');
        }
      }, 3000);
    });
  </script>
