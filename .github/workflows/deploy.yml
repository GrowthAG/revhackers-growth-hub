name: Validate production artifact

on:
  workflow_dispatch:

concurrency:
  group: production-artifact-validation
  cancel-in-progress: false

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDrdt32oOHC86aXqGxm7QC1HpbmH4H2VJk"
          VITE_FIREBASE_AUTH_DOMAIN: "revhackers-staging.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "revhackers-staging"
          VITE_GOOGLE_AUTH_ENABLED: "true"
          VITE_GCP_API_URL: "https://revhackers-api-staging-3na73syj5a-rj.a.run.app"
          VITE_GCP_ENABLED: "true"
          VITE_CLIENTS_GCP_ENABLED: "true"
          VITE_GROWTHMAP_GCP_ENABLED: "true"
        run: npx vite build

      - name: Validate deploy artifact
        run: node scripts/validate-deploy-artifact.mjs ./dist

      - name: Preserve validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: revhackers-validated-dist
          path: ./dist/
          if-no-files-found: error
          retention-days: 7
