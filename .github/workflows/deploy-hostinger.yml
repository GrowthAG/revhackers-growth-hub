name: Deploy Automático Hostinger (FTPS)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy para Hostinger
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Build de Produção (GCP Native Stack)
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDrdt32oOHC86aXqGxm7QC1HpbmH4H2VJk"
          VITE_FIREBASE_AUTH_DOMAIN: "revhackers-staging.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "revhackers-staging"
          VITE_GOOGLE_AUTH_ENABLED: "true"
          VITE_GCP_API_URL: "https://revhackers-api-staging-3na73syj5a-rj.a.run.app"
          VITE_GCP_ENABLED: "true"
          VITE_CLIENTS_GCP_ENABLED: "true"
          VITE_GROWTHMAP_GCP_ENABLED: "true"
        run: npx vite build

      - name: Deploy via SFTP para Hostinger
        env:
          SSH_HOST: "151.106.98.30"
          SSH_PORT: "65002"
          SSH_USERNAME: "u139274360"
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          SSH_REMOTE_DIR: "public_html"
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Configure o Secret HOSTINGER_SSH_PRIVATE_KEY}"

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          install -m 700 -d "$HOME/.ssh"
          cat > "$HOME/.ssh/known_hosts" <<'EOF'
          [151.106.98.30]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGzcHcn75uvWs5rxDQEpS2ylTjLAfuvPt7W7cwICOKFh
          EOF
          chmod 600 "$HOME/.ssh/known_hosts"

          rsync --archive --compress --human-readable --itemize-changes \
            -e "ssh -i $key_file -p $SSH_PORT -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./dist/ "$SSH_USERNAME@$SSH_HOST:$SSH_REMOTE_DIR/"
