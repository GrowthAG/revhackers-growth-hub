name: Deploy Automático Hostinger (FTP)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy para Hostinger
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Build de Produção (GCP Native Stack)
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDrdt32oOHC86aXqGxm7QC1HpbmH4H2VJk"
          VITE_FIREBASE_AUTH_DOMAIN: "revhackers-staging.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "revhackers-staging"
          VITE_GOOGLE_AUTH_ENABLED: "true"
          VITE_GCP_API_URL: "https://revhackers-api-staging-3na73syj5a-rj.a.run.app"
          VITE_GCP_ENABLED: "true"
          VITE_CLIENTS_GCP_ENABLED: "true"
          VITE_GROWTHMAP_GCP_ENABLED: "true"
        run: npx vite build

      - name: Deploy via FTPS para Hostinger
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null 2>&1
          lftp -u "u995977926.rhoficial","$FTP_PASSWORD" \
               -e "set ftp:ssl-allow yes; \
                   set ftp:ssl-force yes; \
                   set ftp:ssl-protect-data yes; \
                   set ssl:verify-certificate no; \
                   set ftp:passive-mode yes; \
                   set net:timeout 60; \
                   set net:max-retries 5; \
                   set net:reconnect-interval-base 5; \
                   mirror --reverse --delete --verbose --parallel=2 ./dist/ /; \
                   bye" \
               ftps://ftp.revhackers.com.br
