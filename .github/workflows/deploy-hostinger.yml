name: Deploy Automático Hostinger (FTPS)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy para Hostinger
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Build de Produção (GCP Native Stack)
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyDrdt32oOHC86aXqGxm7QC1HpbmH4H2VJk"
          VITE_FIREBASE_AUTH_DOMAIN: "revhackers-staging.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "revhackers-staging"
          VITE_GOOGLE_AUTH_ENABLED: "true"
          VITE_GCP_API_URL: "https://revhackers-api-staging-3na73syj5a-rj.a.run.app"
          VITE_GCP_ENABLED: "true"
          VITE_CLIENTS_GCP_ENABLED: "true"
          VITE_GROWTHMAP_GCP_ENABLED: "true"
        run: npx vite build

      - name: Deploy via FTPS para Hostinger
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.HOSTINGER_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Configure o Secret HOSTINGER_FTP_HOST}"
          : "${FTP_USERNAME:?Configure o Secret HOSTINGER_FTP_USERNAME}"
          : "${FTP_PASSWORD:?Configure o Secret FTP_PASSWORD}"
          FTP_REMOTE_DIR="${FTP_REMOTE_DIR:-/public_html}"
          FTP_REMOTE_DIR="/${FTP_REMOTE_DIR#/}"
          FTP_REMOTE_DIR="${FTP_REMOTE_DIR%/}"

          find ./dist -type f -print0 | while IFS= read -r -d '' file; do
            remote_path="${file#./dist/}"
            printf 'Uploading %s\n' "$remote_path"
            curl --fail --show-error --silent \
              --ftp-ssl-reqd \
              --ftp-pasv \
              --ftp-create-dirs \
              --insecure \
              --connect-timeout 30 \
              --max-time 120 \
              --retry 5 \
              --retry-all-errors \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$file" \
              "ftp://$FTP_HOST$FTP_REMOTE_DIR/$remote_path"
          done
