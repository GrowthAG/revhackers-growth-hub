steps:
  # Step 1: fetch secrets do Secret Manager e injeta no build do Vite
  - name: 'gcr.io/cloud-builders/gcloud'
    id: fetch-secrets
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "==> Carregando VITE_SUPABASE_ANON_KEY do Secret Manager..."
        gcloud secrets versions access latest --secret="VITE_SUPABASE_ANON_KEY" > /workspace/.env.secret || echo "VITE_SUPABASE_ANON_KEY=" > /workspace/.env.secret

  # Step 2: build do frontend com Node (gera o dist/)
  - name: 'node:22-slim'
    id: vite-build
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [ -f /workspace/.env.secret ]; then
          export $(cat /workspace/.env.secret | xargs)
        fi
        echo "==> Instalando dependencias..."
        npm ci --prefer-offline || npm install
        echo "==> Buildando frontend (Vite)..."
        npm run build
        echo "==> Build concluido. Arquivos em dist/:"
        ls dist/ | head -10
    env:
      - 'VITE_SUPABASE_URL=${_VITE_SUPABASE_URL}'
      - 'VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}'
      - 'VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}'
      - 'VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}'
      - 'VITE_GOOGLE_AUTH_ENABLED=${_VITE_GOOGLE_AUTH_ENABLED}'
      - 'VITE_GCP_API_URL=${_VITE_GCP_API_URL}'
      - 'VITE_GROWTHMAP_GCP_ENABLED=${_VITE_GROWTHMAP_GCP_ENABLED}'

  # Step 3: build da imagem Docker usando o dist/ gerado
  - name: 'gcr.io/cloud-builders/docker'
    id: docker-build
    args:
      - build
      - --file=Dockerfile.frontend
      - -t=${_IMAGE_BASE}:${SHORT_SHA}
      - -t=${_IMAGE_BASE}:latest
      - .

images:
  - '${_IMAGE_BASE}:${SHORT_SHA}'
  - '${_IMAGE_BASE}:latest'

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  dynamic_substitutions: true

substitutions:
  _IMAGE_BASE: southamerica-east1-docker.pkg.dev/revhackers-staging/revhackers-staging/revhackers-frontend
  _VITE_SUPABASE_URL: 'https://eqspbruarsdybpfeijnf.supabase.co'
  _VITE_FIREBASE_API_KEY: 'AIzaSyDrdt32oOHC86aXqGxm7QC1HpbmH4H2VJk'
  _VITE_FIREBASE_AUTH_DOMAIN: 'revhackers-staging.firebaseapp.com'
  _VITE_FIREBASE_PROJECT_ID: 'revhackers-staging'
  _VITE_GOOGLE_AUTH_ENABLED: 'true'
  _VITE_GCP_API_URL: 'https://revhackers-api-staging-254666331430.southamerica-east1.run.app'
